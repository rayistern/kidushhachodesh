# Netlify deployment for the Kiddush HaChodesh dashboard, book and sky.
#
# The app is built with base='/kh/' and outDir='dist/kh' (see
# vite.config.js — that layout is deliberate and shared with upstream),
# so the site publishes the whole dist/ and serves under /kh/. The root
# redirect makes the bare domain land on the app, and the SPA fallback
# lets react-router own every /kh/* path (/kh/book/14, /kh/sky, …) on
# hard reloads.

[build]
  command = "npm run build"
  publish = "dist"

# The bare app root lands on the book — the reading entry point.
# Netlify-only by nature: the local dev server never reads this file,
# so localhost:3000/kh/ still shows the dashboard.
# force = true because /kh/index.html exists as a real file, and Netlify
# only lets a redirect win over existing content when forced. Exact
# paths only — the /kh/* SPA fallback below must stay unforced.
[[redirects]]
  from = "/"
  to = "/kh/book"
  status = 302
  force = true

[[redirects]]
  from = "/kh"
  to = "/kh/book"
  status = 302
  force = true

[[redirects]]
  from = "/kh/"
  to = "/kh/book"
  status = 302
  force = true

[[redirects]]
  from = "/kh/*"
  to = "/kh/index.html"
  status = 200
