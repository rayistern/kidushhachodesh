# Netlify deployment for the Kiddush HaChodesh dashboard, book and sky.
#
# The app is built with base='/kh/' and outDir='dist/kh' (see
# vite.config.js — that layout is deliberate and shared with upstream),
# so the site publishes the whole dist/ and serves under /kh/. The root
# redirect makes the bare domain land on the app, and the SPA fallback
# lets react-router own every /kh/* path (/kh/book/14, /kh/sky, …) on
# hard reloads.

[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/"
  to = "/kh/"
  status = 302

[[redirects]]
  from = "/kh/*"
  to = "/kh/index.html"
  status = 200
